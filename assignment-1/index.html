<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <section class="hero-banner--primary">
      <header class="hero-banner__header">
        <img
          src="./public/brand-logo.png"
          alt="pokemon logo"
          height="150"
          class="brand-logo"
        />
      </header>
      <main class="hero-content">
        <div class="hero-content__subtitle">pokemon gen i</div>
        <div class="hero-content__title-wrapper"><h1>Pikachu</h1></div>
        <div class="hero-content__description">
          Pikachu is an Electric-type Pokemon introduced <br />
          in Generation I. Pikachu are small, chubby,<br />
          and incredibly cute mouse-like Pokemon. <br />
          They are almost completely covered by <br />
          yellow fur.
        </div>
        <div class="hero-content__pagination"><span class="hero-content__pagination-line">______</span> 01 / 08</div>
      </main>
      <section class="hero-character">
        <img src="./public/hero-character.png" alt="pikachu" height="500" />
      </section>
    </section>
    <section class="hero-banner--secondary">
      <div class="mobile-menu">
        <img src="./public/icon-menu.png" alt="" height="30" />
      </div>
      <div class="pagination-dot pagination-dot--active"></div>
      <div class="pagination-dot pagination-dot--inactive"></div>
      <div class="pagination-dot pagination-dot--inactive"></div>
      <div class="pagination-dot pagination-dot--inactive"></div>
      <div class="pagination-dot pagination-dot--inactive"></div>
    </section>
  </div>
</body>
</html>
