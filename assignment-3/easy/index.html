<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squid Game - Assignment Three - Easy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <header class="header-nav">
      <div class="header-nav__brand-mark">
        <img src="./public/brand-logo.png" alt="logo" height="50" />
      </div>
      <nav class="header-nav__navigation-list">
        <ul>
          <li>About</li>
          <li>Watch now</li>
          <li>Actors</li>
          <li>Contact</li>
        </ul>
      </nav>
      <div class="header-nav__mobile-menu-trigger">
        <img src="./public/icon-hamburger.png" height="40" alt="menu-dropdown" />
      </div>
    </header>

    <main class="hero-section">
      <section class="hero-content">
        <div class="hero-content__brand-mark">
          <img src="./public/brand-logo.png" alt="" height="170" />
        </div>
        <article class="hero-info">
          <p class="hero-info__description">
            Action / Thriller / Drama Series directed by Dong-hyuk Hwang
          </p>
          <p class="hero-info__metadata">Season 1: 9 Episodes</p>
        </article>
        <div class="hero-actions">
          <button class="hero-actions__primary">
            <img src="./public/icon-play.png" alt="play" height="22" />
            <p>Play Now</p>
          </button>
          <button class="hero-actions__secondary">
            <img src="./public/icon-play.png" alt="" height="22" />
            Watch Trailer
          </button>
        </div>
      </section>

      <aside class="hero-visual">
        <img src="./public/character-guard.png" alt="guard" height="500" />
      </aside>
    </main>

    <footer class="clips-gallery">
      <article class="clip-card">
        <img src="./public/clip-thumbnail-1.jpg" alt="img" height="180" class="clip-card__thumbnail" />
        <img src="./public/icon-play.png" alt="play" height="30" class="clip-card__play-icon" />
      </article>
      <article class="clip-card">
        <img src="./public/clip-thumbnail-2.jpg" alt="img" height="180" class="clip-card__thumbnail" />
        <img src="./public/icon-play.png" alt="play" height="30" class="clip-card__play-icon" />
      </article>
      <article class="clip-card">
        <img src="./public/clip-thumbnail-3.jpg" alt="img" height="180" class="clip-card__thumbnail" />
        <img src="./public/icon-play.png" alt="play" height="30" class="clip-card__play-icon" />
      </article>
    </footer>
  </div>
</body>
</html>
